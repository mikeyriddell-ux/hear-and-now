# Use DecapBridge PKCE auth (required)
backend:
  name: github
  repo: mikeyriddell-ux/hear-and-now
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  site_id: b5518f69-a810-4373-9399-60049f26ce35
  stay_logged_in: true

# Add site links in Decap CMS (optional)
# site_url: https://hearandnowradio.com

local_backend: false

media_folder: "public/assets/artists"
public_folder: "/assets/artists"

collections:
  - name: "artists"
    label: "Artists"
    icon: "people"
    folder: "src/content/artists"
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Role", name: "role", widget: "string" }
      - { label: "Genre", name: "genre", widget: "string" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Bio", name: "bio", widget: "text", pattern: [".{0,150}", "Must be 150 characters or less (about 3 lines)"], hint: "Keep it brief — max 150 characters for clean UI." }
      - { label: "Enabled", name: "enabled", widget: "boolean", default: true, hint: "Turn off to hide this artist from the live site" }
      - { label: "Zoom Scale", name: "zoomScale", widget: "string", default: "1.2" }
      - { label: "Object Position", name: "objectPosition", widget: "string", default: "50% 25%" }

  - name: "settings"
    label: "Settings"
    icon: "settings"
    delete: false
    files:
      - name: "hero"
        label: "Hero Section"
        file: "src/content/settings/hero.json"
        fields:
          - { label: "Title Line 1", name: "titleLine1", widget: "string" }
          - { label: "Title Line 2", name: "titleLine2", widget: "string" }
          - { label: "Hero Image", name: "image", widget: "image" }

      - name: "site"
        label: "Site Identity"
        file: "src/content/settings/site.json"
        fields:
          - { label: "Site Name", name: "name", widget: "string" }
          - { label: "Footer Tagline", name: "tagline", widget: "text" }
          - { label: "Hero Footer Text", name: "footerText", widget: "string" }

  - name: "broadcasts"
    label: "Latest Shows"
    icon: "mic"
    folder: "src/content/broadcasts"
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Mixcloud URL", name: "url", widget: "string" }
      - { label: "Order", name: "order", widget: "number", value_type: "int", default: 10 }

  - name: "events"
    label: "Events"
    icon: "event"
    folder: "src/content/events"
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "string", hint: "e.g., Every 2nd & 4th Friday" }
      - { label: "Time", name: "time", widget: "string", hint: "e.g., 20:00 - Late" }
      - { label: "Location", name: "location", widget: "string", hint: "Full address" }
      - { label: "Venue", name: "venue", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "CTA Label", name: "cta", widget: "string", default: "Sign Up" }
      - { label: "CTA Link", name: "ctaLink", widget: "string" }
      - { label: "Enabled", name: "enabled", widget: "boolean", default: true, hint: "Turn off to hide this event from the live site" }

  - name: "upcoming_shows"
    label: "Upcoming Shows"
    icon: "schedule"
    folder: "src/content/upcoming-shows"
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Selector Name", name: "selector", widget: "string" }
      - { label: "Date", name: "date", widget: "string" }
      - { label: "Time", name: "time", widget: "string" }

      - { label: "Order", name: "order", widget: "number", value_type: "int", default: 10 }
      - { label: "Enabled", name: "enabled", widget: "boolean", default: true }
