# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: mikeyriddell-ux/hear-and-now
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/b5518f69-a810-4373-9399-60049f26ce35/pkce
  auth_token_endpoint: /sites/b5518f69-a810-4373-9399-60049f26ce35/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://mikeyriddell-ux.github.io

local_backend: false

media_folder: "public/assets/artists"
public_folder: "/hear-and-now/assets/artists"

collections:
  - name: "artists"
    label: "Artists"
    folder: "src/content/artists"
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Role", name: "role", widget: "string" }
      - { label: "Genre", name: "genre", widget: "string" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Bio", name: "bio", widget: "text" }
      - { label: "Zoom Scale", name: "zoomScale", widget: "string", default: "1.2" }
      - { label: "Object Position", name: "objectPosition", widget: "string", default: "50% 25%" }

  - name: "settings"
    label: "Settings"
    delete: false
    files:
      - name: "hero"
        label: "Hero Section"
        file: "src/content/settings/hero.json"
        fields:
          - { label: "Title Line 1", name: "titleLine1", widget: "string" }
          - { label: "Title Line 2", name: "titleLine2", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Hero Image", name: "image", widget: "image" }

      - name: "site"
        label: "Site Identity"
        file: "src/content/settings/site.json"
        fields:
          - { label: "Site Name", name: "name", widget: "string" }
          - { label: "Footer Tagline", name: "tagline", widget: "text" }
          - { label: "Hero Footer Text", name: "footerText", widget: "string" }

  - name: "broadcasts"
    label: "Broadcasts"
    folder: "src/content/broadcasts"
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Mixcloud URL", name: "url", widget: "string" }
      - { label: "Order", name: "order", widget: "number", value_type: "int", default: 10 }

  - name: "events"
    label: "Events"
    folder: "src/content/events"
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "string", hint: "e.g., Every 2nd & 4th Friday" }
      - { label: "Time", name: "time", widget: "string", hint: "e.g., 20:00 - Late" }
      - { label: "Location", name: "location", widget: "string", hint: "Full address" }
      - { label: "Venue", name: "venue", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "CTA Label", name: "cta", widget: "string", default: "Sign Up" }
      - { label: "CTA Link", name: "ctaLink", widget: "string" }
