<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <title>Content Manager | Hear & Now</title>
    <link href="config.yml" type="text/yaml" rel="cms-config-url">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono&family=Playfair+Display:ital,wght@1,700&display=swap');

        :root {
            --obsidian: #0D0D12;
            --champagne: #C9A84C;
            --ivory: #FAF8F5;
            --slate: #2A2A35;
        }

        body {
            background-color: var(--obsidian);
            margin: 0;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
        }
    </style>
    <link rel="stylesheet" href="cms.css" />
</head>

<body>
    <!-- Scripts for animations -->
    <!-- Advanced CMS Session Persistence (netlifyIdentity Polyfill) -->
    <script>
        (function() {
            const PREFIXES = ['decap-cms', 'netlify-cms', 'gotrue', 'pkce', 'site_id'];
            
            // 1. Restore from Cookies on Load
            document.cookie.split(';').forEach(cookie => {
                const [name, value] = cookie.trim().split('=');
                if (PREFIXES.some(p => name.startsWith(p))) {
                    try {
                        localStorage.setItem(name, decodeURIComponent(value));
                    } catch (e) {}
                }
            });

            // 2. Netlify Identity Polyfill
            // Decap CMS checks this object to stabilize sessions
            window.netlifyIdentity = {
                on: () => {},
                currentUser: () => {
                    const user = localStorage.getItem('decap-cms-user') || localStorage.getItem('netlify-cms-user');
                    if (user) {
                        try { return JSON.parse(user); } catch (e) { return null; }
                    }
                    return null;
                },
                logout: () => {
                    PREFIXES.forEach(p => {
                        for (let i = localStorage.length - 1; i >= 0; i--) {
                            const key = localStorage.key(i);
                            if (key && key.startsWith(p)) localStorage.removeItem(key);
                        }
                    });
                }
            };

            // 3. Persistent Backup
            function backup() {
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (PREFIXES.some(p => key.startsWith(p))) {
                        const value = localStorage.getItem(key);
                        document.cookie = `${key}=${encodeURIComponent(value)}; max-age=${60*60*24*7}; path=/; samesite=lax`;
                    }
                }
            }
            setInterval(backup, 1000);
            localStorage.setItem('site_id', 'b5518f69-a810-4373-9399-60049f26ce35');
        })();
    </script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
