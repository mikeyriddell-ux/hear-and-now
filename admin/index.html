<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <title>Content Manager | Hear & Now</title>
    
    <!-- 1. Priority Session Restore (Blocks UI rendering) -->
    <script>
        (function() {
            const PREFIXES = ['decap-cms', 'netlify-cms', 'gotrue', 'pkce', 'site_id'];
            document.cookie.split(';').forEach(cookie => {
                const [m, v] = cookie.trim().split('=');
                if (PREFIXES.some(p => m.startsWith(p)) && !localStorage.getItem(m)) {
                    localStorage.setItem(m, decodeURIComponent(v));
                }
            });
        })();
    </script>

    <link href="config.yml" type="text/yaml" rel="cms-config-url">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono&family=Playfair+Display:ital,wght@1,700&display=swap');
        
        :root { --obsidian: #0D0D12; }
        body { background-color: var(--obsidian); margin: 0; font-family: 'Inter', sans-serif; }
        
        /* Flicker Killer Overlay */
        #flicker-killer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--obsidian); z-index: 999999;
            display: flex; align-items: center; justify-content: center;
        }
        #flicker-killer.fade-out { opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    </style>
    <link rel="stylesheet" href="cms.css?v=24" />
</head>

<body>
    <div id="flicker-killer"></div>
    <!-- Scripts for animations -->
    <!-- Stable CMS Session Persistence (Backup Only) -->
    <script>
        (function() {
            const PREFIXES = ['decap-cms', 'netlify-cms', 'gotrue', 'pkce', 'site_id'];
            
            // Remove flicker killer after CMS has had a chance to pick up the restored tokens
            setTimeout(() => {
                const killer = document.getElementById('flicker-killer');
                if (killer) killer.classList.add('fade-out');
            }, 300);

            // Backup to Cookies periodically
            function backup() {
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && PREFIXES.some(p => key.startsWith(p))) {
                        const value = localStorage.getItem(key);
                        document.cookie = `${key}=${encodeURIComponent(value)}; max-age=${60*60*24*7}; path=/; samesite=lax`;
                    }
                }
            }
            setInterval(backup, 2000);

            // 3. Forgot Password Link Injection
            const observer = new MutationObserver((mutations) => {
                const loginButton = document.querySelector('button[class*="LoginButton"]');
                if (loginButton && !document.querySelector('#forgot-password-link')) {
                    const link = document.createElement('a');
                    link.id = 'forgot-password-link';
                    link.href = 'https://decapbridge.com/auth/password/forgot?site_id=b5518f69-a810-4373-9399-60049f26ce35';
                    link.target = '_blank';
                    link.innerText = 'Forgot password?';
                    link.style = 'display: block; margin-top: 15px; color: #BBB; font-size: 13px; text-decoration: none; text-align: center; transition: color 0.2s;';
                    link.onmouseover = () => { link.style.textDecoration = 'underline'; link.style.color = '#40E0D0'; };
                    link.onmouseout = () => { link.style.textDecoration = 'none'; link.style.color = '#BBB'; };
                    loginButton.parentNode.insertBefore(link, loginButton.nextSibling);
                }
            });
            observer.observe(document.body, { childList: true, subtree: true });
        })();
    </script>
    <script src="https://unpkg.com/decap-cms@3.3.3/dist/decap-cms.js"></script>
</body>
</html>
